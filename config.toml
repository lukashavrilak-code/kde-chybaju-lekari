max_zlych_datumov = 0.001
zmena_riadkov = 0.10
rozsah_odbornosti = 0.20
max_zmena_plochy = 0.01
max_adries_na_bode = 5
min_podiel_presnych = 0.0
zmena_sr_warn = 0.05
zmena_sr_fail = 0.15
zmena_okres_min = 3
zmena_okres_podiel = 0.25
odlahla_hodnota_nasobok = 3.0

[validacia.ocakavane_pocty]
VLD = 2435
VLDD = 1100

[legenda]
VLD = [4.0, 5.0, 6.0, 7.0]
VLDD = [8.0, 10.0, 12.0, 14.0]
