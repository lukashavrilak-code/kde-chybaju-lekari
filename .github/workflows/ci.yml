name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Inštalácia závislostí s kontrolou hashov
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Kontrola repozitára
        run: python scripts/check_repo.py
      - name: Ruff
        run: ruff check .
      - name: Testy a build webu z umelých dát
        run: python -m pytest -q
      - name: Audit zraniteľností závislostí
        run: pip-audit -r requirements.txt --require-hashes
